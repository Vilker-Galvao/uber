<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <title>Uber - Agendar viagem</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="agendar.css">
</head>
<body>
  <div class="app app-agendar">

    <!-- FUNDO: a home escurecida -->
    <div class="fundo-home">
      <header class="topo">
        <nav class="abas">
          <a href="#" class="aba aba-ativa"><span class="aba-icone">🚗</span>Corridas</a>
          <a href="#" class="aba"><span class="aba-icone">🥗</span>Delivery</a>
        </nav>
        <div class="busca">
          <span class="busca-lupa">🔍</span>
          <span class="busca-texto">Para onde?</span>
          <span class="busca-agora">🕒 Agora<span class="seta-baixo"></span></span>
        </div>
      </header>

      <section class="recentes">
        <div class="lugar">
          <span class="lugar-icone">📍</span>

            <strong>Cariri Shopping</strong>
            <small>S/N - Triânguro</small>
          </span>
          <span class="lugar-seta">›</span>
        </div>
        <div class="lugar">
          <span class="lugar-icone">📍</span>
          <span class="lugar-info">
            <strong>Trabalho</strong>
            <small>Magazine Luiza- loja 05</small>
          </span>
          <span class="lugar-seta">›</span>
        </div>
      </section>

      <section class="secao">
        <div class="secao-titulo">
          <h2>Sugestões</h2>
          <a href="#">Mostrar todos</a>
        </div>
      </section>
    </div>

    <!-- CAMADA ESCURA -->
    <a href="index.html" class="escurecer" aria-label="Fechar"></a>

    <!-- JANELA DE BAIXO -->
    <section class="agendar-janela">
      <h2>Agendar uma viagem</h2>
      <div class="agendar-linha">Dom, 1 jan</div>
      <div class="agendar-linha">09:05 – 09:15</div>
      <div class="rodape">
        <a href="index.html" class="botao-preto">Definir horário de embarque</a>
      </div>
    </section>

  </div>
</body>
</html>
